openapi: 3.0.3
info:
    title: UNO Game API
    version: 1.0.0
    description: Documentação oficial do Projeto
servers:
    - url: http://localhost:3001
      description: Servidor Local de Desenvolvimento

components:
    securitySchemes:
        bearerAuth:
            type: http
            scheme: bearer
            bearerFormat: JWT

    schemas:
        ErrorResponse:
            type: object
            properties:
                error:
                    type: object
                    properties:
                        code:
                            type: string
                            example: "INVALID_REQUEST"
                        message:
                            type: string
                            example: "A mensagem detalhada do erro vai aqui."

security:
    - bearerAuth: []

paths:
    # ==========================================
    # AUTHENTICATION
    # ==========================================
    /api/auth/sign-up:
        post:
            summary: Cria uma nova conta permanente
            tags: [Auth]
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [name, email, password]
                            properties:
                                name:
                                    type: string
                                    example: Isaac
                                email:
                                    type: string
                                    example: isaac@email.com
                                password:
                                    type: string
                                    example: StrongPassword123
            responses:
                "201":
                    description: Conta criada com sucesso
                    content:
                        application/json:
                            schema:
                                example:
                                    data:
                                        player:
                                            {
                                                id: "usr_xxx",
                                                name: "Isaac",
                                                email: "isaac@email.com",
                                                avatarSeed: null,
                                                avatarUrl: null,
                                                isGuest: false,
                                            }
                                        token: "eyJhbG..."
                                    message: "Account created successfully."
                "400":
                    description: Payload inválido
                    content:
                        application/json:
                            schema:
                                $ref: "#/components/schemas/ErrorResponse"
                "409":
                    description: E-mail já registrado

    /api/auth/sign-in:
        post:
            summary: Autentica um jogador existente
            tags: [Auth]
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [email, password]
                            properties:
                                email:
                                    type: string
                                    example: isaac@email.com
                                password:
                                    type: string
                                    example: StrongPassword123
            responses:
                "200":
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                example:
                                    data:
                                        player:
                                            {
                                                id: "usr_xxx",
                                                name: "Isaac",
                                                email: "isaac@email.com",
                                                avatarSeed: "abc123",
                                                avatarUrl: "https://...",
                                                isGuest: false,
                                            }
                                        token: "eyJhbG..."
                "401":
                    description: Credenciais inválidas

    /api/auth/guest:
        post:
            summary: Cria uma conta temporária de visitante
            tags: [Auth]
            security: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [name, avatarSeed]
                            properties:
                                name:
                                    type: string
                                    example: Guest Player
                                avatarSeed:
                                    type: string
                                    example: random_seed_123
            responses:
                "201":
                    description: Visitante criado
                    content:
                        application/json:
                            schema:
                                example:
                                    data:
                                        player:
                                            {
                                                id: "gst_xxx",
                                                name: "Guest Player",
                                                avatarSeed: "random_seed_123",
                                                avatarUrl: "https://...",
                                                isGuest: true,
                                            }
                                        token: "eyJhbG..."

    # ==========================================
    # PLAYERS
    # ==========================================
    /api/players/me:
        get:
            summary: Retorna os dados do perfil logado
            tags: [Players]
            responses:
                "200":
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                example:
                                    data:
                                        player:
                                            {
                                                id: "usr_xxx",
                                                name: "Isaac",
                                                email: "isaac@email.com",
                                                avatarSeed: "abc",
                                                avatarUrl: "https://...",
                                                isGuest: false,
                                            }
                "401":
                    description: Não autorizado

        patch:
            summary: Atualiza os dados do perfil
            tags: [Players]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                name:
                                    type: string
                                avatarSeed:
                                    type: string
            responses:
                "200":
                    description: Perfil atualizado

        delete:
            summary: Deleta a conta do jogador
            tags: [Players]
            responses:
                "204":
                    description: Conta deletada com sucesso (No Content)

    /api/players/me/stats:
        get:
            summary: Retorna as estatísticas totais do jogador
            tags: [Players]
            responses:
                "200":
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                example:
                                    data:
                                        stats:
                                            {
                                                totalMatches: 42,
                                                wins: 15,
                                                winRate: 35.7,
                                                totalCardsPlayed: 1450,
                                                totalCardsDrawn: 890,
                                                timesShoutedUno: 22,
                                            }

    /api/players/me/history:
        get:
            summary: Histórico de partidas paginado
            tags: [Players]
            parameters:
                - in: query
                  name: page
                  schema:
                      type: integer
                      default: 1
                - in: query
                  name: limit
                  schema:
                      type: integer
                      default: 20
            responses:
                "200":
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                example:
                                    data:
                                        items:
                                            - gameId: "game_xxx"
                                              roomCode: "UNO-A1B2"
                                              startedAt: "2026-07-21T14:30:00Z"
                                              finalPosition: 1
                                              points: 45
                                        pagination: { currentPage: 1, totalPages: 5, totalItems: 42, limit: 20 }

    # ==========================================
    # ROOMS (Lobby)
    # ==========================================
    /api/rooms:
        post:
            summary: Cria uma nova sala de jogo
            tags: [Rooms]
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            required: [maxPlayers, isPrivate]
                            properties:
                                maxPlayers:
                                    type: integer
                                    example: 4
                                isPrivate:
                                    type: boolean
                                    example: false
                                password:
                                    type: string
            responses:
                "201":
                    description: Sala criada com sucesso
                    content:
                        application/json:
                            schema:
                                example:
                                    data:
                                        room:
                                            {
                                                id: "room_xxx",
                                                code: "UNO-A1B2",
                                                hostId: "usr_xxx",
                                                maxPlayers: 4,
                                                currentPlayers: 1,
                                                isPrivate: false,
                                                status: "waiting",
                                            }

    /api/rooms/{code}:
        get:
            summary: Valida um código de sala
            tags: [Rooms]
            parameters:
                - in: path
                  name: code
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: Sala válida para entrar
                    content:
                        application/json:
                            schema:
                                example:
                                    data:
                                        room:
                                            {
                                                id: "room_xxx",
                                                code: "UNO-A1B2",
                                                hostId: "usr_xxx",
                                                maxPlayers: 4,
                                                currentPlayers: 3,
                                                isPrivate: false,
                                                status: "waiting",
                                            }
                                        canJoin: true
                "404":
                    description: Sala não encontrada
                "409":
                    description: Sala cheia ou jogo já iniciado

    /api/rooms/{id}:
        patch:
            summary: Atualiza as configurações da sala (Apenas Host)
            tags: [Rooms]
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: string
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            type: object
                            properties:
                                maxPlayers:
                                    type: integer
                                isPrivate:
                                    type: boolean
                                password:
                                    type: string
            responses:
                "200":
                    description: Atualizado

        delete:
            summary: Cancela e fecha a sala (Apenas Host)
            tags: [Rooms]
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: string
            responses:
                "204":
                    description: Sala excluída

    # ==========================================
    # LEADERBOARD
    # ==========================================
    /api/leaderboard:
        get:
            summary: Ranking global de jogadores
            tags: [Leaderboard]
            parameters:
                - in: query
                  name: limit
                  schema:
                      type: integer
                      default: 10
            responses:
                "200":
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                example:
                                    data:
                                        leaderboard:
                                            - rank: 1
                                              playerId: "usr_xxx"
                                              name: "Isaac"
                                              totalWins: 150
                                              winRate: 55.2

    # ==========================================
    # GAMES
    # ==========================================
    /api/games/{id}:
        get:
            summary: Retorna o resumo completo de uma partida finalizada
            tags: [Games]
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                      type: string
            responses:
                "200":
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                example:
                                    data:
                                        game:
                                            {
                                                id: "game_xxx",
                                                roomCode: "UNO-A1B2",
                                                winnerPlayerId: "usr_xxx",
                                                status: "finished",
                                                durationSeconds: 900,
                                            }
                                        players:
                                            - playerId: "usr_xxx"
                                              name: "Isaac"
                                              finalPosition: 1
                                              points: 50
                                              cardsPlayed: 12
                                              cardsDrawn: 2
                                              hasCalledUno: true
                "404":
                    description: Partida não encontrada
