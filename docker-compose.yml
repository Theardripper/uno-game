services:
    frontend:
        build:
            context: .
            dockerfile: apps/frontend/Dockerfile
        ports:
            - "3000:3000"
        environment:
            - NODE_ENV=production
            - NEXT_PUBLIC_API_URL=http://localhost:4000
        depends_on:
            - mock-api
        restart: unless-stopped

    api:
        build:
            context: .
            dockerfile: apps/api/Dockerfile
        ports:
            - "3001:3001"
        env_file:
            - .env
        restart: unless-stopped

    mock-api:
        build:
            context: .
            dockerfile: apps/[mock] api/Dockerfile
        ports:
            - "4000:4000"
        restart: unless-stopped
